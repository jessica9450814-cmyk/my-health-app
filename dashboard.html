<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>健康儀表板 🌸</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .theme-pink { --main-color: #ff758c; --light-bg: #fdf6f7; --border-color: #ffe4e6; }
        .theme-blue { --main-color: #3498db; --light-bg: #eaf2f8; --border-color: #d1e8f9; }
        .theme-green { --main-color: #27ae60; --light-bg: #eafaf1; --border-color: #d5f5e3; }
        .theme-purple { --main-color: #9b59b6; --light-bg: #f4ecf7; --border-color: #e8daef; }

        body { font-family: "Microsoft JhengHei", sans-serif; background-color: var(--light-bg); padding: 20px; color: #555; transition: 0.3s; }
        .container { max-width: 800px; margin: auto; }
        h2 { color: var(--main-color); text-align: center; margin-bottom: 25px; }

        .theme-selector { text-align: center; margin-bottom: 20px; }
        .theme-btn { border: none; width: 25px; height: 25px; border-radius: 50%; cursor: pointer; margin: 0 5px; border: 2px solid #ddd; transition: 0.3s; }
        .theme-btn:hover { transform: scale(1.2); }

        .section { background: white; padding: 25px; border-radius: 30px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid var(--border-color); }
        .section-title { font-size: 18px; color: var(--main-color); font-weight: bold; margin-bottom: 15px; border-left: 5px solid var(--main-color); padding-left: 10px; }
        .advice-card { background: #fffdf5; border-left: 5px solid #f1c40f; padding: 20px; border-radius: 20px; margin-bottom: 20px; color: #856404; font-size: 14px; box-shadow: 0 5px 15px rgba(0,0,0,0.03); }

        .summary-card { display: flex; justify-content: space-around; background: #fff9fa; padding: 20px; border-radius: 20px; border: 1px solid var(--border-color); }
        .stat-value { font-size: 28px; font-weight: bold; color: var(--main-color); text-align: center; }
        .stat-label { font-size: 13px; color: #888; text-align: center; margin-bottom: 5px; }

        .progress-bar { height: 10px; background: var(--border-color); border-radius: 5px; margin-top: 10px; overflow: hidden; }
        #progressFill { height: 100%; background: var(--main-color); width: 0%; transition: 1s ease-out; }

        .export-btn { width: 100%; padding: 12px; background-color: var(--border-color); border: none; border-radius: 20px; color: var(--main-color); font-weight: bold; cursor: pointer; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        th { color: var(--main-color); padding: 12px; border-bottom: 2px solid var(--border-color); }
        td { padding: 12px; border-bottom: 1px solid #fceef0; text-align: center; }
        .danger-row { background-color: #fff0f3; color: #d63384; }
        .del-btn { cursor: pointer; color: var(--main-color); font-size: 18px; transition: 0.2s; }
        .del-btn:hover { transform: scale(1.3); }
    </style>
</head>

<body>
    <div class="container">
        <h2>🌸 健康儀表板</h2>
        <div class="theme-selector">
            <button class="theme-btn" style="background:#ff758c" onclick="changeTheme('theme-pink')"></button>
            <button class="theme-btn" style="background:#3498db" onclick="changeTheme('theme-blue')"></button>
            <button class="theme-btn" style="background:#27ae60" onclick="changeTheme('theme-green')"></button>
            <button class="theme-btn" style="background:#9b59b6" onclick="changeTheme('theme-purple')"></button>
        </div>

        <div id="advicePlaceholder"></div>

        <div class="section">
            <div class="section-title">狀況提醒</div>
            <div id="reminderBox" style="background-color: #fff3cd; color: #856404; padding: 10px; border-radius: 15px; display: none; margin-bottom: 10px;"></div>
            <div id="alertBox" style="background-color: #f8d7da; color: #721c24; padding: 10px; border-radius: 15px; display: none;"></div>
            <div class="summary-card" style="margin-top: 15px;">
                <div><div class="stat-label">最新收縮壓</div><div class="stat-value" id="lastSys">-</div></div>
                <div><div class="stat-label">最新心跳</div><div class="stat-value" id="lastHr">-</div></div>
            </div>
        </div>

        <div class="section">
            <div class="section-title">服藥進度</div>
            <div id="medicineStatus" style="font-size: 14px; font-weight: bold; color: var(--main-color);">正在載入數據...</div>
            <div class="progress-bar"><div id="progressFill"></div></div>
            <button class="export-btn" onclick="exportToCSV()">📥 匯出健康報表 (CSV)</button>
        </div>

        <div class="section">
            <div class="section-title">趨勢分析</div>
            <canvas id="myChart" style="max-height: 250px;"></canvas>
            <table>
                <thead><tr><th>日期</th><th>血壓</th><th>心跳</th><th>管理</th></tr></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>

        <a href="/" style="display: block; text-align: center; color: #aaa; text-decoration: none; font-size: 14px; margin-bottom: 30px;">← 回到輸入頁面</a>
    </div>

    <script>
        document.body.className = localStorage.getItem('theme') || 'theme-pink';

        function changeTheme(themeName) {
            document.body.className = themeName;
            localStorage.setItem('theme', themeName);
            location.reload(); 
        }

        async function initDashboard() {
            const res = await fetch('/api/health');
            const data = await res.json();
            if (data.length === 0) {
                document.getElementById('medicineStatus').textContent = "尚無紀錄";
                return;
            }

            const sortedData = [...data].reverse();
            
            document.getElementById('advicePlaceholder').innerHTML = `<div class="advice-card">${generateAdvice(sortedData[0])}</div>`;

            const today = new Date().toISOString().split('T')[0];
            if (!data.some(row => row.record_date === today)) {
                document.getElementById('reminderBox').style.display = 'block';
                document.getElementById('reminderBox').innerHTML = `🔔 提醒：您今天尚未輸入紀錄喔！`;
            }

            document.getElementById('lastSys').textContent = sortedData[0].systolic;
            document.getElementById('lastHr').textContent = sortedData[0].heart_rate;
            if (sortedData[0].systolic > 130) {
                document.getElementById('alertBox').style.display = 'block';
                document.getElementById('alertBox').innerHTML = `⚠️ 注意：最新收縮壓偏高，請多留意！`;
            }

            updateMedicineStatus(data);

            const tbody = document.getElementById('tableBody');
            // 【重要】確保 ID 欄位名稱對應正確，如果你的資料庫 ID 欄位是 _id，請改為 row._id
            tbody.innerHTML = sortedData.map(row => {
    const recordId = row.id || row._id; // 自動選擇正確的 ID 欄位
    return `
        <tr class="${row.systolic > 130 ? 'danger-row' : ''}">
            <td>${row.record_date}</td>
            <td>${row.systolic}/${row.diastolic}</td>
            <td>${row.heart_rate}</td>
            <td><span class="del-btn" onclick="deleteRecord('${recordId}')">🗑️</span></td>
        </tr>
    `;
}).join('');

            const mainColor = getComputedStyle(document.body).getPropertyValue('--main-color').trim();
            new Chart(document.getElementById('myChart'), {
                type: 'line',
                data: {
                    labels: sortedData.map(r => r.record_date),
                    datasets: [
                        { label: '收縮壓', data: sortedData.map(r => r.systolic), borderColor: mainColor, tension: 0.4 },
                        { label: '舒張壓', data: sortedData.map(r => r.diastolic), borderColor: '#f39c12', tension: 0.4 },
                        { label: '心跳', data: sortedData.map(r => r.heart_rate), borderColor: '#75d6ff', tension: 0.4 }
                    ]
                }
            });
        }

        function generateAdvice(record) {
            let advice = "<h3>🩺 健康分析小提醒</h3><ul>";
            if (record.systolic > 140 || record.diastolic > 90) advice += "<li><b>血壓偏高：</b>建議減少鈉攝取，多喝水，保持規律作息。</li>";
            else if (record.systolic > 130) advice += "<li><b>血壓略高：</b>請注意飲食清淡，增加適度有氧運動。</li>";
            else advice += "<li><b>血壓穩定：</b>目前的血壓狀況很棒，請繼續保持！</li>";
            if (record.heart_rate > 100) advice += "<li><b>心跳偏快：</b>若休息時心跳仍過快，建議放慢呼吸。</li>";
            if (record.took_medicine == 0) advice += "<li><b>用藥提醒：</b>本日未記錄服藥，請檢查是否忘記服用！</li>";
            if (record.bowel_movement && record.bowel_movement.includes('便秘')) advice += "<li><b>腸胃提醒：</b>紀錄顯示便秘，建議多吃高纖蔬果，並補充水分。</li>";
            if (record.discomfort !== "無" && record.discomfort !== "") advice += `<li><b>症狀留意：</b>您記錄了「${record.discomfort}」，請多休息。</li>`;
            return advice + "</ul>";
        }

        function updateMedicineStatus(data) {
            const now = new Date();
            const thisMonthData = data.filter(r => {
                const d = new Date(r.record_date);
                return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
            });
            const total = thisMonthData.length;
            const taken = thisMonthData.filter(r => r.took_medicine == 1).length;
            const pct = total > 0 ? (taken / total) * 100 : 0;
            document.getElementById('medicineStatus').textContent = `本月已記錄 ${total} 天，共 ${taken} 天服藥`;
            document.getElementById('progressFill').style.width = pct + "%";
            document.getElementById('progressFill').style.backgroundColor = getComputedStyle(document.body).getPropertyValue('--main-color').trim();
        }

        async function deleteRecord(id) {
            if(confirm("確定刪除此筆紀錄？")) {
                try {
                    const response = await fetch(`/api/health/${id}`, { method: 'DELETE' });
                    if (response.ok) {
                        alert("刪除成功！");
                        location.reload();
                    } else {
                        alert("刪除失敗，請檢查 API 路徑或 ID。");
                    }
                } catch (error) {
                    console.error("刪除錯誤:", error);
                }
            }
        }

        function exportToCSV() {
            fetch('/api/health').then(res => res.json()).then(data => {
                let csv = "日期,收縮壓,舒張壓,心跳,服藥,症狀,排便\n";
                data.forEach(r => csv += `${r.record_date},${r.systolic},${r.diastolic},${r.heart_rate},${r.took_medicine},${r.discomfort},${r.bowel_movement}\n`);
                const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = "健康紀錄.csv";
                link.click();
            });
        }
        initDashboard();
    </script>
</body>
</html>
