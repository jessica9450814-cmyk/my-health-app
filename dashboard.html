<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>健康儀表板 🌸</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .theme-pink { --main-color: #ff758c; --light-bg: #fdf6f7; --border-color: #ffe4e6; }
        .theme-blue { --main-color: #3498db; --light-bg: #eaf2f8; --border-color: #d1e8f9; }
        .theme-green { --main-color: #27ae60; --light-bg: #eafaf1; --border-color: #d5f5e3; }
        .theme-purple { --main-color: #9b59b6; --light-bg: #f4ecf7; --border-color: #e8daef; }

        body { font-family: "Microsoft JhengHei", sans-serif; background-color: var(--light-bg); padding: 20px; color: #555; transition: 0.3s; }
        .container { max-width: 800px; margin: auto; }
        h2 { color: var(--main-color); text-align: center; margin-bottom: 25px; }

        .section { background: white; padding: 25px; border-radius: 30px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid var(--border-color); }
        .section-title { font-size: 18px; color: var(--main-color); font-weight: bold; margin-bottom: 15px; border-left: 5px solid var(--main-color); padding-left: 10px; }
        .advice-card { background: #fffdf5; border-left: 5px solid #f1c40f; padding: 20px; border-radius: 20px; margin-bottom: 20px; color: #856404; font-size: 14px; box-shadow: 0 5px 15px rgba(0,0,0,0.03); }

        .summary-card { display: flex; justify-content: space-around; background: #fff9fa; padding: 20px; border-radius: 20px; border: 1px solid var(--border-color); }
        .stat-value { font-size: 28px; font-weight: bold; color: var(--main-color); text-align: center; }
        .stat-label { font-size: 13px; color: #888; text-align: center; margin-bottom: 5px; }

        .progress-bar { height: 10px; background: var(--border-color); border-radius: 5px; margin-top: 10px; overflow: hidden; }
        #progressFill { height: 100%; background: var(--main-color); width: 0%; transition: 1s ease-out; }

        .export-btn { width: 100%; padding: 12px; background-color: var(--border-color); border: none; border-radius: 20px; color: var(--main-color); font-weight: bold; cursor: pointer; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        th { color: var(--main-color); padding: 12px; border-bottom: 2px solid var(--border-color); }
        td { padding: 12px; border-bottom: 1px solid #fceef0; text-align: center; }
        .danger-row { background-color: #fff0f3; color: #d63384; }
        .del-btn { cursor: pointer; color: var(--main-color); font-size: 18px; transition: 0.2s; }
        .del-btn:hover { transform: scale(1.3); }
    </style>
</head>

<body>
    <div class="container">
        <h2>🌸 健康儀表板</h2>
        <div id="advicePlaceholder"></div>

        <div class="section">
            <div class="section-title">狀況提醒</div>
            <div id="reminderBox" style="background-color: #fff3cd; color: #856404; padding: 10px; border-radius: 15px; display: none; margin-bottom: 10px;"></div>
            <div id="alertBox" style="background-color: #f8d7da; color: #721c24; padding: 10px; border-radius: 15px; display: none;"></div>
            <div class="summary-card" style="margin-top: 15px;">
                <div><div class="stat-label">最新收縮壓</div><div class="stat-value" id="lastSys">-</div></div>
                <div><div class="stat-label">最新心跳</div><div class="stat-value" id="lastHr">-</div></div>
            </div>
        </div>

        <div class="section">
            <div class="section-title">服藥進度</div>
            <div id="medicineStatus" style="font-size: 14px; font-weight: bold; color: var(--main-color);">正在載入數據...</div>
            <div class="progress-bar"><div id="progressFill"></div></div>
            <button class="export-btn" onclick="exportToCSV()">📥 匯出健康報表 (CSV)</button>
        </div>

        <div class="section">
            <div class="section-title">趨勢分析</div>
            <canvas id="myChart" style="max-height: 250px;"></canvas>
            <table>
                <thead><tr><th>日期</th><th>血壓</th><th>心跳</th><th>管理</th></tr></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
        <a href="/" style="display: block; text-align: center; color: #aaa; text-decoration: none; font-size: 14px; margin-bottom: 30px;">← 回到輸入頁面</a>
    </div>

    <script>
        document.body.className = localStorage.getItem('theme') || 'theme-pink';

        async function initDashboard() {
            try {
                const res = await fetch('/api/health');
                const data = await res.json();
                if (data.length === 0) return;

                const sortedData = [...data].reverse();
                
                // 數據顯示邏輯
                document.getElementById('lastSys').textContent = sortedData[0].systolic;
                document.getElementById('lastHr').textContent = sortedData[0].heart_rate;
                
                // 渲染表格 (加上刪除按鈕)
                const tbody = document.getElementById('tableBody');
                tbody.innerHTML = sortedData.map(row => `
                    <tr>
                        <td>${row.record_date}</td>
                        <td>${row.systolic}/${row.diastolic}</td>
                        <td>${row.heart_rate}</td>
                        <td><span class="del-btn" onclick="deleteRecord(${row.id})">🗑️</span></td>
                    </tr>
                `).join('');

                // 圖表繪製
                const ctx = document.getElementById('myChart').getContext('2d');
                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: sortedData.map(r => r.record_date),
                        datasets: [{ label: '收縮壓', data: sortedData.map(r => r.systolic), borderColor: '#ff758c', tension: 0.4 }]
                    }
                });
            } catch (err) { console.error(err); }
        }

        async function deleteRecord(id) {
            if(!confirm("確定刪除此筆紀錄？")) return;
            const res = await fetch(`/api/health/${id}`, { method: 'DELETE' });
            if (res.ok) location.reload();
            else alert("刪除失敗");
        }

        function exportToCSV() { /* ...維持你原本的匯出邏輯... */ }
        initDashboard();
    </script>
</body>
</html>
