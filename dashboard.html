<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>健康儀表板 🌸</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .theme-pink { --main-color: #ff758c; --light-bg: #fdf6f7; --border-color: #ffe4e6; }
        .theme-blue { --main-color: #3498db; --light-bg: #eaf2f8; --border-color: #d1e8f9; }
        .theme-green { --main-color: #27ae60; --light-bg: #eafaf1; --border-color: #d5f5e3; }
        .theme-purple { --main-color: #9b59b6; --light-bg: #f4ecf7; --border-color: #e8daef; }

        body { font-family: "Microsoft JhengHei", sans-serif; background-color: var(--light-bg); padding: 20px; color: #555; transition: 0.3s; }
        .container { max-width: 800px; margin: auto; }
        h2 { color: var(--main-color); text-align: center; margin-bottom: 25px; }
        .section { background: white; padding: 25px; border-radius: 30px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid var(--border-color); }
        .section-title { font-size: 18px; color: var(--main-color); font-weight: bold; margin-bottom: 15px; border-left: 5px solid var(--main-color); padding-left: 10px; }
        .advice-card { background: #fffdf5; border-left: 5px solid #f1c40f; padding: 20px; border-radius: 20px; margin-bottom: 20px; color: #856404; font-size: 14px; }
        .summary-card { display: flex; justify-content: space-around; background: #fff9fa; padding: 20px; border-radius: 20px; border: 1px solid var(--border-color); }
        .stat-value { font-size: 28px; font-weight: bold; color: var(--main-color); text-align: center; }
        .progress-bar { height: 10px; background: var(--border-color); border-radius: 5px; margin-top: 10px; overflow: hidden; }
        #progressFill { height: 100%; background: var(--main-color); width: 0%; transition: 1s; }
        .export-btn { width: 100%; padding: 12px; background-color: var(--border-color); border: none; border-radius: 20px; color: var(--main-color); font-weight: bold; cursor: pointer; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th { color: var(--main-color); padding: 12px; border-bottom: 2px solid var(--border-color); }
        td { padding: 12px; border-bottom: 1px solid #fceef0; text-align: center; }
        .del-btn { cursor: pointer; color: var(--main-color); font-size: 18px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🌸 健康儀表板</h2>
        <div id="advicePlaceholder"></div>

        <div class="section">
            <div class="section-title">狀況提醒</div>
            <div id="reminderBox" style="display:none; padding:10px; background:#fff3cd; color:#856404; border-radius:15px; margin-bottom:10px;"></div>
            <div class="summary-card">
                <div><div style="font-size:13px; color:#888;">最新收縮壓</div><div class="stat-value" id="lastSys">-</div></div>
                <div><div style="font-size:13px; color:#888;">最新心跳</div><div class="stat-value" id="lastHr">-</div></div>
            </div>
        </div>

        <div class="section">
            <div class="section-title">服藥進度</div>
            <div id="medicineStatus" style="font-weight:bold; color:var(--main-color);">正在載入...</div>
            <div class="progress-bar"><div id="progressFill"></div></div>
            <button class="export-btn" onclick="exportToCSV()">📥 匯出健康報表 (CSV)</button>
        </div>

        <div class="section">
            <div class="section-title">趨勢分析 (血壓與心跳)</div>
            <canvas id="myChart" style="max-height: 300px;"></canvas>
            <table>
                <thead><tr><th>日期</th><th>血壓</th><th>心跳</th><th>管理</th></tr></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>

        <a href="/" style="display: block; text-align: center; color: #aaa; text-decoration: none; font-size: 14px; margin-bottom: 30px;">← 回到輸入頁面</a>
    </div>

    <script>
        document.body.className = localStorage.getItem('theme') || 'theme-pink';
        
        async function initDashboard() {
            try {
                const res = await fetch('/api/health');
                const data = await res.json();
                if (data.length === 0) return;
                const sorted = [...data].reverse();
                
                document.getElementById('advicePlaceholder').innerHTML = `<div class="advice-card">${generateAdvice(sorted[0])}</div>`;
                const today = new Date().toISOString().split('T')[0];
                if (!data.some(r => r.record_date === today)) {
                    document.getElementById('reminderBox').style.display = 'block';
                    document.getElementById('reminderBox').innerHTML = "🔔 提醒：您今天尚未輸入紀錄喔！";
                }
                document.getElementById('lastSys').textContent = sorted[0].systolic;
                document.getElementById('lastHr').textContent = sorted[0].heart_rate;

                document.getElementById('tableBody').innerHTML = sorted.map(r => `<tr>
                    <td>${r.record_date}</td><td>${r.systolic}/${r.diastolic}</td><td>${r.heart_rate}</td>
                    <td><span class="del-btn" onclick="deleteRecord(${r.id})">🗑️</span></td>
                </tr>`).join('');

                const taken = data.filter(r => r.took_medicine == 1).length;
                document.getElementById('medicineStatus').textContent = `本月共 ${taken} 天服藥`;
                document.getElementById('progressFill').style.width = (data.length ? (taken/data.length)*100 : 0) + "%";

                new Chart(document.getElementById('myChart'), {
                    type: 'line',
                    data: {
                        labels: sorted.map(r => r.record_date),
                        datasets: [
                            { label: '收縮壓', data: sorted.map(r => r.systolic), borderColor: '#ff758c' },
                            { label: '舒張壓', data: sorted.map(r => r.diastolic), borderColor: '#f39c12' },
                            { label: '心跳', data: sorted.map(r => r.heart_rate), borderColor: '#3498db' }
                        ]
                    }
                });
            } catch (err) { console.error(err); }
        }

        function generateAdvice(r) {
            let s = "<h3>🩺 健康分析小提醒</h3><ul>";
            s += r.systolic > 140 ? "<li><b>血壓偏高：</b>建議減少鈉攝取，多休息。</li>" : "<li><b>血壓狀況穩定。</b></li>";
            s += r.heart_rate > 100 ? "<li><b>心跳偏快：</b>請多深呼吸並放鬆。</li>" : "";
            s += r.took_medicine == 0 ? "<li><b>用藥提醒：</b>請檢查今日是否忘記服藥。</li>" : "";
            return s + "</ul>";
        }

        async function deleteRecord(id) {
            if(!confirm("確定刪除此筆紀錄嗎？")) return;
            const res = await fetch(`/api/health/${id}`, { method: 'DELETE' });
            if (res.ok) location.reload();
            else alert("刪除失敗");
        }

        function exportToCSV() {
            fetch('/api/health').then(r => r.json()).then(data => {
                let csv = "日期,收縮壓,舒張壓,心跳,服藥\n" + data.map(r => `${r.record_date},${r.systolic},${r.diastolic},${r.heart_rate},${r.took_medicine}`).join("\n");
                const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv' });
                const a = document.createElement("a");
                a.href = URL.createObjectURL(blob);
                a.download = "健康報表.csv";
                a.click();
            });
        }
        initDashboard();
    </script>
</body>
</html>
