<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日健康記錄 🌸</title>
    <style>
        /* 主題顏色 */
        .theme-pink { --main-color: #ff758c; --light-bg: #fdf6f7; --border-color: #ffe4e6; }
        
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: var(--light-bg); padding: 20px; color: #555; }
        .container { max-width: 450px; margin: auto; background: #ffffff; padding: 30px; border-radius: 30px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); border: 1px solid var(--border-color); }
        h2 { text-align: center; color: var(--main-color); margin-bottom: 25px; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { padding: 15px; width: 100%; box-sizing: border-box; border: 2px solid var(--border-color); border-radius: 15px; background-color: #fff9fa; }
        
        button[type="submit"] { width: 100%; padding: 15px; background-color: var(--main-color); color: white; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; margin-top: 20px; }
        .nav-link { display: block; text-align: center; margin-top: 20px; color: var(--main-color); text-decoration: none; font-weight: bold; }
        
        /* 成功提示 */
        #toast { display: none; position: fixed; top: 20px; left: 50%; transform: translateX(-50%); padding: 15px 30px; background: #ff758c; color: white; border-radius: 50px; z-index: 1000; }
    </style>
</head>
<body>
    <div id="toast">💖 資料已成功儲存！</div>

    <div class="container">
        <h2>🌸 每日健康記錄</h2>
        <form id="healthForm">
            <div class="form-group"><label>日期</label><input type="date" id="date" required></div>
            <div style="display: flex; gap: 10px;">
                <div class="form-group"><label>收縮壓</label><input type="number" id="systolic" placeholder="mmHg" required></div>
                <div class="form-group"><label>舒張壓</label><input type="number" id="diastolic" placeholder="mmHg" required></div>
            </div>
            <div class="form-group"><label>心跳</label><input type="number" id="heart_rate" placeholder="bpm" required></div>
            <div class="form-group">
                <label>今日服藥</label>
                <select id="took_medicine">
                    <option value="1">有服藥</option>
                    <option value="0">無服藥</option>
                </select>
            </div>
            <div class="form-group"><label>不適症狀</label><input type="text" id="discomfort" placeholder="若無可留空"></div>
            <div class="form-group"><label>排便狀況</label><input type="text" id="bowel_movement" placeholder="例：正常"></div>

            <button type="submit">送出資料</button>
        </form>
        <a href="/dashboard" class="nav-link">前往查看儀表板 →</a>
    </div>

    <script>
        // 設定今天日期
        document.getElementById('date').valueAsDate = new Date();

        document.getElementById('healthForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const payload = {
                date: document.getElementById('date').value,
                systolic: document.getElementById('systolic').value,
                diastolic: document.getElementById('diastolic').value,
                heart_rate: document.getElementById('heart_rate').value,
                took_medicine: document.getElementById('took_medicine').value,
                discomfort: document.getElementById('discomfort').value || "無",
                bowel_movement: document.getElementById('bowel_movement').value || "無"
            };
            
            try {
                // 發送請求到後端 API
                const response = await fetch('/api/health', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (response.ok) {
                    const toast = document.getElementById('toast');
                    toast.style.display = 'block';
                    setTimeout(() => { toast.style.display = 'none'; }, 2000);
                    document.getElementById('healthForm').reset();
                    document.getElementById('date').valueAsDate = new Date();
                } else {
                    alert("儲存失敗，請檢查伺服器連線。");
                }
            } catch (err) {
                alert("無法連線至伺服器，請稍後再試。");
            }
        });
    </script>
</body>
</html>
